<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.theme === 'light') { document.documentElement.classList.remove('dark'); }
        else { document.documentElement.classList.add('dark'); localStorage.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/api-config.js"></script>
</head>
<body class="min-h-screen font-sans flex flex-col items-center p-6 bg-transparent relative transition-colors duration-300">
    <div id="vanta-bg" class="fixed inset-0 z-[-1]"></div>
    
    <!-- FLOATING SIDE ACTION MENU -->
    <div class="fixed right-4 md:right-6 top-1/2 transform -translate-y-1/2 flex flex-col items-end gap-4 z-[100]">
        <button id="themeToggle" class="side-action-btn group" aria-label="Toggle theme" title="Toggle Theme">
            <span class="side-action-label">Theme</span>
            <!-- Moon -->
            <svg id="moonIcon" class="w-6 h-6 flex-shrink-0 hidden dark:block transition-transform duration-300 group-hover:-rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <!-- Sun -->
            <svg id="sunIcon" class="w-6 h-6 flex-shrink-0 block stroke-amber-500 dark:hidden transition-transform duration-300 group-hover:rotate-45 group-hover:stroke-white" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
        </button>
        
        <button id="supportBtn" class="side-action-btn group" aria-label="Support" title="Get Support">
            <span class="side-action-label">Support</span>
            <!-- Help/Support Bug/Bubble Vector -->
            <svg class="w-6 h-6 flex-shrink-0 transition-transform duration-300 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </button>

        <button id="feedbackBtn" class="side-action-btn group" aria-label="Feedback" title="Send Feedback">
            <span class="side-action-label">Feedback</span>
            <svg class="w-6 h-6 flex-shrink-0 transition-transform duration-300 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <!-- Extremely recognizable message feedback exclamation icon -->
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 16.9a8.5 8.5 0 0 1-8.5 4.1L3 22l1.3-4.5A8.5 8.5 0 1 1 21 11.5v5.4z"></path>
            </svg>
        </button>
    </div>

    <!-- TECH THEME BORDER -->
    <div class="absolute inset-3 md:inset-5 pointer-events-none z-50 rounded-2xl border border-blue-500/20 dark:border-blue-400/30 overflow-hidden" id="techFrame">
        <div class="absolute top-0 left-0 w-16 h-16 border-t-[3px] border-l-[3px] border-blue-500/80 rounded-tl-2xl"></div>
        <div class="absolute top-0 right-0 w-16 h-16 border-t-[3px] border-r-[3px] border-purple-500/80 rounded-tr-2xl"></div>
        <div class="absolute bottom-0 left-0 w-16 h-16 border-b-[3px] border-l-[3px] border-purple-500/80 rounded-bl-2xl"></div>
        <div class="absolute bottom-0 right-0 w-16 h-16 border-b-[3px] border-r-[3px] border-blue-500/80 rounded-br-2xl"></div>
        <div class="absolute inset-0 shadow-[inset_0_0_50px_rgba(59,130,246,0.05)] rounded-2xl"></div>
    </div>

    <!-- SPLASH SCREEN OVERLAY -->
    <div id="splashScreen" class="fixed inset-0 z-40 flex flex-col items-center justify-center transition-all duration-1000 backdrop-blur-xl bg-white/30 dark:bg-[#050505]/60">
        
        <h1 class="text-5xl md:text-7xl font-bold title-glow premium-text-anim-wide mb-8 text-center uppercase tracking-widest px-4">AI Resume Analyser</h1>

        <div class="fade-in-delayed">
            <button id="startAppBtn" class="glow-button px-10 py-5 text-xl tracking-widest uppercase flex items-center gap-3">
                <span>Start Experience</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTENT (Hidden initially) -->
    <div id="mainContent" class="max-w-3xl w-full mx-auto mt-10 p-10 glass-panel relative floating hidden opacity-0">
        <h1 class="text-5xl font-bold title-glow mb-4 text-center premium-text-anim">AI Resume Analyser</h1>
        <p class="text-slate-600 dark:text-slate-400 mb-10 text-center text-lg max-w-2xl mx-auto">Upload your resume and the job description to get instant ATS feedback, keyword matching, and AI-powered bullet point improvements.</p>
        
        <form id="analyzeForm" class="space-y-8">
            <div>
                <label for="resume" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 uppercase tracking-wide">Upload Resume (PDF/DOC) <span class="text-red-500">*</span></label>
                <div id="dropZone" class="gradient-border-box p-10 text-center flex flex-col items-center justify-center relative">
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required aria-label="Upload Resume File">
                    <div id="fileInfo" class="pointer-events-none z-0">
                        <svg class="mx-auto h-14 w-14 text-slate-400 dark:text-slate-500 mb-4 transition-colors" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="text-xl text-slate-700 dark:text-slate-200 font-semibold">Drop your resume here or choose a file</p>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">PDF, DOC, or DOCX only (Max 10 MB)</p>
                    </div>
                </div>
                <!-- Validation & Actions -->
                <div class="flex justify-between items-start mt-3 min-h-[30px]">
                    <div id="fileError" class="text-red-500 dark:text-red-400 text-sm font-bold hidden flex items-center gap-1.5" aria-live="assertive">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="fileErrorText">File size exceeds maximum limit.</span>
                    </div>
                    <button type="button" id="clearFileBtn" class="hidden text-sm font-bold text-slate-500 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 transition-colors ml-auto flex items-center gap-1 min-h-[44px] px-2 z-20" aria-label="Clear selected file" title="Remove this file and choose another">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        Clear File
                    </button>
                </div>
            </div>

            <div>
                <label for="job_description" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 uppercase tracking-wide">Job Description</label>
                <textarea id="job_description" name="job_description" rows="7" class="w-full rounded-xl p-5 text-base focus:outline-none transition-all font-medium" placeholder="Paste the full job description here..." required></textarea>
            </div>

            <button type="submit" id="submitBtn" aria-label="Analyze Resume" title="Evaluate resume against ATS and job keywords" class="glow-button w-full py-5 text-xl relative overflow-hidden flex items-center justify-center mt-4">
                <span id="btnText">Analyze Resume</span>
                <div id="loadingOverlay" class="absolute inset-0 bg-white/90 dark:bg-[#050505]/80 hidden flex items-center justify-center rounded-lg backdrop-blur-sm z-20">
                    <div class="spinner border-4 border-slate-200 dark:border-slate-700 border-t-indigo-500 rounded-full w-7 h-7 animate-spin"></div>
                    <span id="loadingText" class="ml-4 font-bold text-indigo-600 dark:text-indigo-400 text-lg tracking-wide">Analyzing with AI 🤖...</span>
                </div>
            </button>
        </form>
    </div>

    <!-- Vanta.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        const form = document.getElementById('analyzeForm');
        const fileInput = document.getElementById('resume');
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document.getElementById('fileInfo');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const themeToggle = document.getElementById('themeToggle');
        const splashScreen = document.getElementById('splashScreen');
        const mainContent = document.getElementById('mainContent');
        const startAppBtn = document.getElementById('startAppBtn');

        // Splash Screen Logic
        startAppBtn.addEventListener('click', () => {
            splashScreen.classList.add('splash-exit');
            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 1000);
            
            mainContent.classList.remove('hidden', 'opacity-0');
            mainContent.classList.add('app-enter');
        });

        let vantaEffect = null;
        function initVanta() {
            const isDark = document.documentElement.classList.contains('dark');
            if (vantaEffect) vantaEffect.destroy();
            vantaEffect = VANTA.NET({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: isDark ? 0xa855f7 : 0x6366f1,
                backgroundColor: isDark ? 0x050505 : 0xf8fafc,
                backgroundAlpha: 0.0, // Allow CSS linear gradient to shine
                points: isDark ? 12.00 : 10.00,
                maxDistance: isDark ? 20.00 : 25.00,
                spacing: isDark ? 18.00 : 20.00,
                showDots: true
            });
        }
        initVanta();

        // Drag and Drop Smart Feedback Interactions
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragging'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragging'), false);
        });
        dropZone.addEventListener('drop', (e) => {
            if (fileInput.files.length > 0) return; // Block drop if file exists
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                const event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        });

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            initVanta();
        });

        const fileError = document.getElementById('fileError');
        const fileErrorText = document.getElementById('fileErrorText');
        const clearFileBtn = document.getElementById('clearFileBtn');
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB limit

        function resetDropZone() {
            fileInput.value = ''; 
            fileInput.style.display = 'block'; // Ensure input is back
            fileInfo.innerHTML = `
                <svg class="mx-auto h-14 w-14 text-slate-400 dark:text-slate-500 mb-4 transition-colors" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="text-xl text-slate-700 dark:text-slate-200 font-semibold">Drop your resume here or choose a file</p>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">PDF, DOC, or DOCX only (Max 10 MB)</p>
            `;
            dropZone.style.border = ''; 
            dropZone.classList.remove('pointer-events-none');
            clearFileBtn.classList.add('hidden');
        }

        clearFileBtn.addEventListener('click', () => {
            resetDropZone();
            fileError.classList.add('hidden');
        });

        function validateFile(file) {
            const validTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            const validExts = ['.pdf', '.doc', '.docx'];
            
            if (file.size > MAX_FILE_SIZE) {
                return "Resume too large (max 10MB). Try a smaller file size.";
            }

            const isMatch = validTypes.includes(file.type) || validExts.some(ext => file.name.toLowerCase().endsWith(ext));
            if (!isMatch) {
                return "File type not supported. Please upload a PDF or DOCX.";
            }
            return null;
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const error = validateFile(file);
                
                if (error) {
                    resetDropZone();
                    fileErrorText.innerText = error;
                    fileError.classList.remove('hidden');
                    dropZone.style.border = '2px dashed #ef4444'; 
                } else {
                    fileError.classList.add('hidden');
                    fileInput.style.display = 'none'; // Lock further uploads
                    
                    const fileSize = formatBytes(file.size);
                    fileInfo.innerHTML = `
                        <div class="file-success-card">
                            <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-900/40 flex items-center justify-center mb-2">
                                <svg class="w-8 h-8 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <div class="text-center">
                                <p class="text-blue-600 dark:text-purple-400 font-bold text-xl truncate max-w-[250px] mb-1">${file.name}</p>
                                <span class="file-size-badge">${fileSize}</span>
                            </div>
                        </div>
                    `;
                    dropZone.style.border = '2px solid #10b981';
                    clearFileBtn.classList.remove('hidden');
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loadText = document.getElementById('loadingText');
            loadText.innerText = "Uploading Resume 📄...";
            loadingOverlay.classList.remove('hidden');

            // Simulate UI transition sequence per user request
            setTimeout(() => { loadText.innerText = "Analyzing with AI 🤖..."; }, 1500);

            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);
            formData.append('job_description', document.getElementById('job_description').value);

            try {
                const response = await fetch(`${API_CONFIG.baseUrl}/analyze`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Server error");
                const result = await response.json();
                
                if (result.error) {
                    alert('Error: ' + result.error);
                    loadingOverlay.classList.add('hidden');
                } else {
                    loadText.innerText = "Done ✅";
                    setTimeout(() => {
                        localStorage.setItem('analysisResult', JSON.stringify(result));
                        window.location.href = 'result.html';
                    }, 500);
                }
            } catch (err) {
                alert('An error occurred during analysis: ' + err.message);
                loadingOverlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
